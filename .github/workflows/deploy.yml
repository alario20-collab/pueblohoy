name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: 167.233.47.180
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/pueblohoy
            git pull origin main
            docker compose down
            docker compose up -d
